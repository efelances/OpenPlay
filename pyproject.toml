[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openplay-access"
version = "0.2.0"
description = "Open-source modular PC game accessibility platform for players with physical, motor, speech, or visual disabilities."
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pywebview>=5.3",
    "pywin32>=306; sys_platform == 'win32'",
    "opencv-python>=4.10.0",
    "mediapipe>=0.10.14",
    "sounddevice>=0.5.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "pyinstaller>=6.10.0",
    "pillow>=10.4.0",
]
gamepad = [
    "vgamepad>=0.1.0",
]

[project.scripts]
openplay-access = "openplay.__main__:main"

[tool.setuptools.packages.find]
include = ["openplay*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
